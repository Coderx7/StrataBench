name: Checks
on: [push, pull_request]
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Prepare coding integration runtime
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: docker pull python:3.12-slim
      - name: Prepare small upstream evaluator checks
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python -m stratabench prepare-suite ifeval
          python -m stratabench prepare-suite bfcl
          python -m stratabench prepare-suite writingbench
      - name: Run tests
        env:
          STRATABENCH_DOCKER_TEST_IMAGE: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.12' && 'python:3.12-slim' || '' }}
        run: python -m unittest discover -s tests -v
      - name: Check aliased temporary paths
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        env:
          STRATABENCH_DOCKER_TEST_IMAGE: python:3.12-slim
        run: python tests/run_path_alias_checks.py
      - run: node --check stratabench/web/app.js
      - run: node --check stratabench/web/setup.js
      - run: node --check stratabench/web/outcomes.js
      - run: node --check stratabench/web/helpers.js
      - run: node --check stratabench/web/budgets.js
